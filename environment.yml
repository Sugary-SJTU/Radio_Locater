# Conda 环境只负责解释器和开发工具；项目自身仍由最后一行 pip -e . 安装。
name: mcm
channels:
  # 统一使用 conda-forge，减少同一依赖从多个渠道混装的风险。
  - conda-forge
dependencies:
  # 源码最低支持 Python 3.11，并允许当前环境中的 3.14。
  - python>=3.11,<3.15
  - pip
  - numpy
  - pandas
  - openpyxl
  - pyyaml
  - matplotlib
  - seaborn
  - scipy
  - pytest
  - ruff
  - jupyterlab
  - ipykernel
  - pip:
      # 用于读取 reference 中的题面 PDF 和 Word 接口附件。
      - pypdf
      - python-docx
      # 可编辑安装使源码修改立即生效，同时读取 pyproject.toml 中的 Python 依赖。
      - -e .
